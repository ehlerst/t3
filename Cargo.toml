[workspace]
resolver = "2"
members = [
    "crates/t3-telemetry",
    "crates/t3-s3-client",
    "crates/t3-storage",
    "crates/t3-core",
    "crates/t3-cli",
    "crates/t3-benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RustStack Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ehlerst/t3"
readme = "README.md"

[workspace.dependencies]
# Internal crates
t3-telemetry = { path = "crates/t3-telemetry" }
t3-s3-client = { path = "crates/t3-s3-client" }
t3-storage = { path = "crates/t3-storage" }
t3-core = { path = "crates/t3-core" }

# Async & HTTP runtime
tokio = { version = "1.43", features = ["full"] }
bytes = "1.10"
http = "1.2"
http-body-util = "0.1"
hyper = { version = "1.5", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"

# Serialization & Formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
form_urlencoded = "1.2"
url = "2.5"

# Cryptography, Checksums & Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
dashmap = "6.1"
parking_lot = "0.12"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
crc32fast = "1.4"
hex = "0.4"
base64 = "0.22"
regex = "1.11"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive", "env"] }
fastrand = "2.3"
walkdir = "2.5"
indicatif = "0.17"
libc = "0.2"

# Dev & Benchmarks
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
tempfile = "3.16"
axum = { version = "0.8", features = ["tokio", "http2"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
