name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Test
        run: cargo test --workspace --all-targets --all-features

  build:
    name: Build - ${{ matrix.artifact_name }} (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 (static musl binary)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: t3-linux-amd64

          # Linux arm64 (static musl binary)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: t3-linux-arm64

          # macOS arm64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: t3-darwin-arm64

          # macOS amd64 (Intel)
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: t3-darwin-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run Cargo Build
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: "--release --bin t3"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Binary, Tarball, and SHA256 Checksum
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/t3 dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}
          tar -C target/${{ matrix.target }}/release -czf dist/${{ matrix.artifact_name }}.tar.gz t3
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
            sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
            shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  release:
    name: Publish GitHub Release (amd64 & arm64 Binaries + SHA256)
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Combined SHA256SUMS.txt & Homebrew Formula
        run: |
          cp install.sh artifacts/install.sh
          cd artifacts
          sha256sum t3-linux-amd64 t3-linux-amd64.tar.gz t3-linux-arm64 t3-linux-arm64.tar.gz t3-darwin-amd64 t3-darwin-amd64.tar.gz t3-darwin-arm64 t3-darwin-arm64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

          VER="${GITHUB_REF_NAME#v}"
          SHA_DARWIN_ARM64=$(awk '{print $1}' t3-darwin-arm64.tar.gz.sha256)
          SHA_DARWIN_AMD64=$(awk '{print $1}' t3-darwin-amd64.tar.gz.sha256)
          SHA_LINUX_ARM64=$(awk '{print $1}' t3-linux-arm64.tar.gz.sha256)
          SHA_LINUX_AMD64=$(awk '{print $1}' t3-linux-amd64.tar.gz.sha256)

          cat > t3.rb <<EOF
          class T3 < Formula
            desc "t3 (Turbo 3): Blazing-fast parallel S3 client and drop-in s5cmd replacement in Rust"
            homepage "https://ehlerst.github.io/t3/"
            version "${VER}"
            license any_of: ["Apache-2.0", "MIT"]

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/ehlerst/t3/releases/download/v${VER}/t3-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/ehlerst/t3/releases/download/v${VER}/t3-darwin-amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/ehlerst/t3/releases/download/v${VER}/t3-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/ehlerst/t3/releases/download/v${VER}/t3-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              bin.install "t3"
            end
          end
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: t3 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/t3-*
            artifacts/SHA256SUMS.txt
            artifacts/install.sh
            artifacts/t3.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
